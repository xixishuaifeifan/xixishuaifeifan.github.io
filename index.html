<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xixishuaifeifan | 赛博主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: #000510;
            color: #fff;
            font-family: 'Consolas', 'Microsoft Yahei', sans-serif;
            overflow-x: hidden;
        }
        /* 星空背景 */
        #stars{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        /* 主容器 */
        .container{
            position: relative;
            z-index: 1;
            text-align: center;
            padding-top: 120px;
            padding-bottom: 80px;
        }
        .card{
            max-width: 650px;
            margin: 0 auto;
            padding: 50px 30px;
            border: 1px solid #0ea5e950;
            border-radius: 20px;
            background: linear-gradient(135deg, #0b101ecc, #000510cc);
            box-shadow: 0 0 50px #0099ff33;
            backdrop-filter: blur(8px);
        }
        h1{
            font-size: 42px;
            color: #38bdf8;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #38bdf8, 0 0 30px #0ea5e9;
            margin-bottom: 20px;
        }
        .neon-line{
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22d3ee, transparent);
            margin: 25px auto;
            box-shadow: 0 0 10px #22d3ee;
        }
        p{
            font-size: 18px;
            color: #94a3b8;
            line-height: 1.8;
            margin: 10px 0;
        }
        .tags{
            margin-top: 30px;
        }
        .tag{
            display: inline-block;
            margin: 8px 6px;
            padding: 8px 18px;
            border: 1px solid #22d3ee;
            border-radius: 25px;
            color: #22d3ee;
            font-size: 14px;
            background: #0ea5e910;
            box-shadow: 0 0 10px #0ea5e940;
            transition: all 0.3s;
        }
        .tag:hover{
            background: #0ea5e930;
            box-shadow: 0 0 20px #0ea5e980;
            transform: translateY(-3px);
        }
        .footer{
            margin-top: 50px;
            font-size: 13px;
            color: #475569;
        }
    </style>
</head>
<body>
    <!-- 动态星空背景 -->
    <canvas id="stars"></canvas>

    <div class="container">
        <div class="card">
            <h1>XIXISHUAIFEIFAN</h1>
            <div class="neon-line"></div>
            <p>电子信息工程 · 科技探索者</p>
            <p>电路 | AI | 编程 | 创意实践</p>

            <div class="tags">
                <span class="tag">代码不崩</span>
                <span class="tag">BUG退散</span>
                <span class="tag">赛博朋克</span>
                <span class="tag">热爱创新</span>
                <span class="tag">永远在线</span>
            </div>
        </div>

        <div class="footer">
            © 2026 GitHub Pages | Powered by Code & Starlight
        </div>
    </div>

    <!-- 星空动画JS -->
    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = [];
        const starCount = 250;

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                opacity: Math.random()
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();

                star.opacity += Math.random() * 0.02 - 0.01;
                if (star.opacity < 0.1) star.opacity = 0.1;
                if (star.opacity > 1) star.opacity = 1;

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        drawStars();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
